# 🖊️ GitHub Pages 自动部署工作流
# 触发条件：push 到 main 分支，且 commit message 包含 "build-page"

name: Deploy GitHub Pages Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 🔐 权限配置
permissions:
  contents: read          # 📖 读取仓库代码
  pages: write            # 📄 写入 GitHub Pages
  id-token: write         # 🪪 用于 Pages 部署的身份验证

# 🔄 并发控制
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════
  # 📦 Job: 部署到 GitHub Pages（子路径 /GLMImpressionOfVincentZyu/）
  # ═══════════════════════════════════════════════════
  deploy-gh-pages:
    runs-on: ubuntu-latest
    # 🔍 只有 commit message 包含 "build-page" 才触发部署（workflow_dispatch 手动触发时无条件执行）
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'build-page')"
    steps:
      # 📥 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 🟢 安装 Node.js 并启用 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 📦 安装依赖
      - name: Install dependencies
        run: npm ci

      # 🔨 构建 GitHub Pages 版本
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      # ⚙️ 配置 GitHub Pages 环境
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 📤 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 🚀 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
